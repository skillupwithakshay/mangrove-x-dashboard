name: Daily data refresh

on:
  schedule:
    # 06:00 UTC daily. Adjust to your team's timezone/needs.
    - cron: '0 11 * * *'   # 6:00 AM Central (CDT)
    - cron: '0 18 * * *'   # 1:00 PM Central (CDT)
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write   # needed to commit refreshed data/*.json back to the repo
  id-token: write   # needed for Workload Identity Federation (GA4 auth)

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Job-level env so the optional Slack step can gate on `env.*` — GitHub
    # does not allow `secrets.*` directly inside an `if:` condition.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node dependencies
        # google-auth-library (WIF/ADC for GA4) is the first third-party Node
        # dependency in this repo. Install once here so every Node fetcher has
        # its modules; Node itself is preinstalled on ubuntu-latest.
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run X data pipeline
        # continue-on-error so one source's failure (e.g. a transient X 503)
        # never aborts the others — every source is independent and the commit
        # step below publishes whatever succeeded. fetch_x_data.py also retries
        # transient 5xx with backoff before giving up.
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python pipeline/fetch_x_data.py

      - name: Run YouTube data pipeline
        # Uses one OAuth refresh token for both the YouTube Data API v3
        # (channel + video stats) and the YouTube Analytics API (watch time,
        # impressions, traffic sources, subscriber gains). continue-on-error
        # so a YouTube/token hiccup doesn't block the PyPI refresh or the
        # commit of X data below — on failure the script leaves
        # data/youtube_latest.json untouched (last good file stays deployed).
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python pipeline/fetch_youtube_data.py

      - name: Run Instagram data pipeline
        # Instagram Graph API (Business/Creator account): account insights,
        # follower demographics and per-post metrics. continue-on-error so an
        # IG/token issue (e.g. the 60-day user token expiring) doesn't block
        # the other refreshes or the commit below — on failure the last good
        # data/instagram_latest.json stays deployed. Use a Meta System User
        # token (never expires) for IG_ACCESS_TOKEN to avoid expiry entirely.
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python pipeline/fetch_instagram_data.py

      - name: Run TikTok data pipeline
        # TikTok Display API (Login Kit). Refreshes a ~24h access token from
        # the stored refresh token each run. continue-on-error so a TikTok/
        # token issue (e.g. the ~365-day refresh token expiring) doesn't block
        # the other refreshes or the commit — on failure the last good
        # data/tiktok_latest.json stays deployed.
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python pipeline/fetch_tiktok_data.py

      # LinkedIn is EXPORT-driven (not scraped). The owner runs
      # pipeline/build_linkedin_from_export.py locally on the Page admin Excel
      # exports and commits data/linkedin_latest.json. The daily snapshot step
      # below then keeps banking linkedin/followers from that committed file.
      # (The old Selenium scraper step was removed — no li_at / Chrome in CI.)

      - name: Run PyPI data pipeline
        # Reads the WordPress endpoint (matches mangrove.ai) with a pypistats
        # fallback; needs no secrets. continue-on-error so a temporary
        # WordPress/pypistats outage doesn't block the X refresh below — on
        # failure the script leaves data/pypi_latest.json untouched (last good).
        continue-on-error: true
        run: python pipeline/fetch_pypi_data.py

      - name: Fetch HubSpot CRM metrics
        # CRM "Revenue Engine": health, sources, funnels, monthly acquisition,
        # deals, forms → data/hubspot.json. continue-on-error so a HubSpot/token
        # issue never blocks the other sources; on failure the last good
        # data/hubspot.json stays deployed. The token is passed via env only —
        # never printed, logged, or committed (only ${{ secrets.HUBSPOT_TOKEN }}).
        # Node is preinstalled on ubuntu-latest; the script uses global fetch.
        continue-on-error: true
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: node fetch-hubspot.mjs

      - name: Fetch Discord metrics
        # Discord community analytics → data/discord.json. continue-on-error so a
        # Discord/token issue never blocks the other sources; on failure the last
        # good data/discord.json stays deployed. Tokens passed via env only —
        # never printed, logged, or committed (only ${{ secrets.* }}).
        continue-on-error: true
        run: node fetch-discord.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}

      - name: Authenticate to Google Cloud (WIF)
        # Keyless auth for GA4 via Workload Identity Federation. Exchanges the
        # job's OIDC token for short-lived credentials and impersonates the
        # ga4-dashboard-reader service account, then writes a credentials file
        # and sets GOOGLE_APPLICATION_CREDENTIALS so fetch-ga4.mjs picks it up
        # via ADC. continue-on-error so a WIF misconfig never blocks other sources.
        id: ga4-auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Fetch GA4 website metrics
        # Writes data/ga4.json via the GA4 Data API. Auth comes from the WIF
        # step above (ADC) — no stored key. continue-on-error so it never
        # blocks other sources; on failure the last good data/ga4.json stays.
        continue-on-error: true
        run: node fetch-ga4.mjs
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}

      - name: Fetch Stripe metrics
        # Payments → data/stripe.json (paidCount, reachedPayment, revenue).
        # Lights up the funnel's "Reached payment" + "Paid" stages. Runs BEFORE
        # the funnel build so the assembler picks it up the same run.
        # continue-on-error so a Stripe/key issue never blocks other sources; on
        # failure the last good data/stripe.json stays deployed. The restricted
        # read-only key is passed via env only — never printed, logged, or
        # committed (only ${{ secrets.STRIPE_API_KEY }}).
        continue-on-error: true
        run: node fetch-stripe.mjs
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

      - name: Configure AWS credentials (OIDC)
        # Keyless AWS auth: assume the mangrove-dashboard-cognito-read IAM role
        # via GitHub OIDC and export short-lived credentials (access key, secret,
        # and session token) as env vars for the step below. fetch-product.mjs
        # reads them from the environment and signs SigV4 with the session token
        # — no static key stored. Uses permissions: id-token: write (already set
        # for GA4). continue-on-error so an auth hiccup never blocks other sources.
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch product signups (Cognito)
        # Product signups/activations → data/product.json (funnel "Signed up" +
        # "Activated"). Reads the Cognito user pool via a hand-signed SigV4
        # ListUsers call. Runs BEFORE the funnel build so the assembler picks it
        # up the same run. continue-on-error so an AWS/creds issue never blocks
        # other sources; on failure the last good data/product.json stays
        # deployed. AWS creds via env only — never printed, logged, or committed.
        continue-on-error: true
        run: node fetch-product.mjs
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_ACTIVATION_ATTRIBUTE: ${{ secrets.COGNITO_ACTIVATION_ATTRIBUTE }}

      - name: Build cross-source funnel
        # Assembles data/funnel.json from whatever source files exist
        # (discord/ga4/stripe/product/links). No secrets; safe to always run.
        continue-on-error: true
        run: node fetch-funnel.mjs

      - name: Bank daily snapshots
        # Reuses the values already fetched above (reads data/*_latest.json,
        # never re-fetches) and upserts one row per platform/metric/day into
        # data/snapshots.json so growth over 7D/30D/6M/1Y can be computed.
        continue-on-error: true
        run: python pipeline/snapshot_from_latest.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each data file only if it exists — the optional pipelines
          # (YouTube, PyPI) may not have produced a file yet (e.g. secrets not
          # set), and `git add` of a missing path would fail the whole step.
          for f in data/x_latest.json data/x_followers_history.json data/youtube_latest.json data/instagram_latest.json data/tiktok_latest.json data/linkedin_latest.json data/linkedin_followers_history.json data/pypi_latest.json data/hubspot.json data/discord.json data/ga4.json data/stripe.json data/product.json data/funnel.json data/snapshots.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          git diff --cached --quiet && echo "No data changes to commit" && exit 0
          git commit -m "chore: daily data refresh [skip ci]"
          git push

      - name: Post summary to Slack
        # Only runs once SLACK_WEBHOOK_URL is added as a repo secret (Settings
        # -> Secrets and variables -> Actions). Until then this step is
        # skipped rather than failing the whole run, so Slack is optional
        # and doesn't block the data refresh above.
        # SLACK_WEBHOOK_URL comes from job-level env (set from the secret).
        # `secrets.*` isn't allowed in `if:`, so gate on env instead.
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          # Update this if the dashboard's deployed URL ever changes.
          DASHBOARD_URL: "https://mangrove-x-dashboard.vercel.app"
        run: python pipeline/post_slack_summary.py
        # A failed Slack post fails just this step, not the data refresh —
        # data/x_latest.json is already committed by the time this runs.
